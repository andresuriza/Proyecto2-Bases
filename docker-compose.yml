# Plataforma de anotación de datos (Proyecto 2). Red interna p2net; SÓLO el gateway publica 8000.
# Perfiles: (por defecto) núcleo | spark2 (segundo worker) | tools (herramientas/simulador).
name: proyecto2

x-mongo: &mongo
  image: mongo:7
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
  restart: unless-stopped
  networks: [p2net]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

x-comun: &comun
  MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
  MONGO_W: ${MONGO_W:-majority}
  VALKEY_URL: redis://valkey:6379/0
  LOCK_TTL_MS: ${LOCK_TTL_MS:-120000}
  DATALAKE_DIR: /datalake
  DATALAKE_GRANDE_DIR: /datalake_grande
  DATALAKE_VALIDACION_DIR: /datalake_validacion
  SPARK_MASTER: spark://spark-master:7077
  OPT_FILTRO_PRIMERO: ${OPT_FILTRO_PRIMERO:-1}   # P5: 0 = deduplicar antes de filtrar (comparación)

x-py-health: &py-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  mongo1:
    <<: *mongo
    container_name: mongo1
    hostname: mongo1
    volumes: [mongo1-data:/data/db]
  mongo2:
    <<: *mongo
    container_name: mongo2
    hostname: mongo2
    volumes: [mongo2-data:/data/db]
  mongo3:
    <<: *mongo
    container_name: mongo3
    hostname: mongo3
    volumes: [mongo3-data:/data/db]

  # Inicializa el replica set (idempotente): prioridades 2/1/1.
  mongo-init:
    image: mongo:7
    container_name: mongo-init
    networks: [p2net]
    restart: "no"
    depends_on:
      mongo1: {condition: service_healthy}
      mongo2: {condition: service_healthy}
      mongo3: {condition: service_healthy}
    entrypoint: ["mongosh", "--host", "mongo1:27017", "--quiet", "--eval"]
    command:
      - |
        let ok = false;
        try { ok = rs.status().ok === 1; } catch (e) { ok = false; }
        if (!ok) {
          printjson(rs.initiate({_id: "rs0", members: [
            {_id: 0, host: "mongo1:27017", priority: 2},
            {_id: 1, host: "mongo2:27017", priority: 1},
            {_id: 2, host: "mongo3:27017", priority: 1}]}));
        } else { print("replica set ya inicializado"); }
        let n = 0;
        while (!db.hello().isWritablePrimary && n++ < 120) { sleep(500); }
        print("primario listo: " + db.hello().primary);

  valkey:
    image: valkey/valkey:8
    container_name: valkey
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    networks: [p2net]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  registro:
    build: {context: ./servicios, dockerfile: registro/Dockerfile}
    container_name: registro
    restart: unless-stopped
    networks: [p2net]
    environment: *comun
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/salud', timeout=2)"]
      <<: *py-health

  sesion:
    build: {context: ./servicios, dockerfile: sesion/Dockerfile}
    container_name: sesion
    restart: unless-stopped
    networks: [p2net]
    environment: *comun
    depends_on:
      valkey: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/salud', timeout=2)"]
      <<: *py-health

  gateway:
    build: {context: ./servicios, dockerfile: gateway/Dockerfile}
    container_name: gateway
    restart: unless-stopped
    networks: [p2net]
    environment: *comun
    ports:
      - "8000:8000"   # ÚNICO puerto publicado al host
    # No depende de historial/analitica: /salud los reporta como degradado si faltan.
    depends_on:
      registro: {condition: service_started}
      sesion: {condition: service_started}
      valkey: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud', timeout=3)"]
      <<: *py-health

  historial:
    build: {context: ./servicios, dockerfile: historial/Dockerfile}
    container_name: historial
    restart: unless-stopped
    networks: [p2net]
    environment: *comun
    volumes:
      - ${DATALAKE_SRC:-./datalake}:/datalake
      - ${DATALAKE_GRANDE_SRC:-./datalake_grande}:/datalake_grande:ro
      - ${DATALAKE_VALIDACION_SRC:-./datalake_validacion}:/datalake_validacion:ro
    depends_on:
      valkey: {condition: service_healthy}

  analitica:
    build: {context: ./servicios, dockerfile: analitica/Dockerfile}
    container_name: analitica
    restart: unless-stopped
    networks: [p2net]
    environment: *comun
    volumes:
      - ${DATALAKE_SRC:-./datalake}:/datalake:ro
      - ${DATALAKE_GRANDE_SRC:-./datalake_grande}:/datalake_grande:ro
      - ${DATALAKE_VALIDACION_SRC:-./datalake_validacion}:/datalake_validacion:ro
    ports:
      - "127.0.0.1:4040:4040"   # Spark UI del driver (sólo localhost)
    depends_on:
      valkey: {condition: service_healthy}
      spark-master: {condition: service_started}

  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    networks: [p2net]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:18080:8080"   # UI de administración (sólo localhost)

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    restart: unless-stopped
    networks: [p2net]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ${DATALAKE_SRC:-./datalake}:/datalake:ro
      - ${DATALAKE_GRANDE_SRC:-./datalake_grande}:/datalake_grande:ro
      - ${DATALAKE_VALIDACION_SRC:-./datalake_validacion}:/datalake_validacion:ro
    depends_on: [spark-master]

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    profiles: [spark2]
    restart: unless-stopped
    networks: [p2net]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ${DATALAKE_SRC:-./datalake}:/datalake:ro
      - ${DATALAKE_GRANDE_SRC:-./datalake_grande}:/datalake_grande:ro
      - ${DATALAKE_VALIDACION_SRC:-./datalake_validacion}:/datalake_validacion:ro
    depends_on: [spark-master]

  # Contenedor de utilidades dentro de la red (simulador, pruebas, cargadores del dataset).
  #   docker compose --profile tools run --rm herramientas python simulador/simulador.py ...
  herramientas:
    build: {context: ./servicios/herramientas}
    container_name: herramientas
    profiles: [tools]
    networks: [p2net]
    working_dir: /src
    environment:
      <<: *comun
      GATEWAY_URL: http://gateway:8000
    volumes:
      - .:/src
      - ${DATALAKE_SRC:-./datalake}:/datalake
      - ${DATALAKE_GRANDE_SRC:-./datalake_grande}:/datalake_grande
      - ${DATALAKE_VALIDACION_SRC:-./datalake_validacion}:/datalake_validacion
    command: ["sleep", "infinity"]

networks:
  p2net:
    name: p2net

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  valkey-data:
